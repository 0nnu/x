<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برايم كورد - PrimeCord</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
        }

        .container {
            text-align: center;
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
        }

        .container h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .container p {
            font-size: 1rem;
            margin-bottom: 20px;
            color: #666;
        }

        .cf-turnstile {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="statusText">الرجاء التحقق من أنك لست روبوتًا</h1>
        <!-- Cloudflare Turnstile CAPTCHA -->
        <div class="cf-turnstile" 
             data-sitekey="0x4AAAAAAA5Sfsj-pcRmgmyy" 
             data-callback="onSuccess" 
             data-error-callback="onError"></div>
    </div>

    <script>
        function onSuccess(token) {
            // تحديث النص إلى "إعادة التوجيه..."
            const statusText = document.getElementById('statusText');
            statusText.textContent = "إعادة التوجيه...";
            
            // انتظار لمدة ثانيتين ثم التوجيه إلى الصفحة المطلوبة
            setTimeout(() => {
                window.location.href = "/success.html";
            }, 2000);
        }

        function onError() {
            alert("تعذر إكمال التحقق. الرجاء المحاولة لاحقًا.");
        }
    </script>
</body>
</html>
