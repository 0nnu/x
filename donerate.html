<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقييمات المقبولة</title>
    <style>
        /* التنسيقات نفسها */
    </style>
</head>
<body>
    <h1>التقييمات المقبولة</h1>
    <div class="reviews-container" id="approvedReviewsContainer"></div>

    <script>
        const apiUrl = "http://127.0.0.1:5000/reviews";

        async function loadApprovedReviews() {
            const response = await fetch(apiUrl);
            const data = await response.json();

            const reviewsContainer = document.getElementById('approvedReviewsContainer');
            reviewsContainer.innerHTML = '';

            data.approved.forEach(review => {
                const reviewDiv = document.createElement('div');
                reviewDiv.classList.add('review');
                reviewDiv.innerHTML = `
                    <strong>${review.username}</strong>
                    <p>${review.feedback}</p>
                    <small>${new Date(review.timestamp).toLocaleString()}</small>
                `;
                reviewsContainer.appendChild(reviewDiv);
            });
        }

        // تحميل التقييمات المقبولة عند تحميل الصفحة
        loadApprovedReviews();
    </script>
</body>
</html>
